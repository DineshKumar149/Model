<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <clipPath id="circleView">
      <circle cx="50" cy="50" r="50" fill="#FFFFFF" />
    </clipPath>
  </defs>
  <!-- Assuming the user places logo.png in the public folder -->
  <image width="100" height="100" href="/logo.png" clip-path="url(#circleView)" />
</svg>
